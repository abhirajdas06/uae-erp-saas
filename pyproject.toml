[project]
name = "uae-erp-saas"
version = "0.1.0"
description = "Modular multi-tenant ERP SaaS platform for UAE businesses"
requires-python = "==3.14.*"
dependencies = [
    "Django==6.1.2",
]

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "build",
    "docs",
    "scripts/quality",
    "tests/quality",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"
